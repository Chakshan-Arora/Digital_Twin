[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hdt"
version = "0.1.0"
description = "Research prototype for uncertainty-aware 3D clearance analysis on medical scans"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "HDT Research Team" },
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "SimpleITK>=2.2.0",
    "nibabel>=5.0.0",
    "scikit-image>=0.20.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "opencv-python>=4.8.0",
    "mediapipe>=0.10.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["hdt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    "venv",
    ".venv",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["hdt"]

[tool.ruff.lint.per-file-ignores]
# Allow asserts in tests
"tests/**" = ["B011", "B018"]
